<title>Meal Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..650&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Farben: light-dark(hell, dunkel) folgt dem Hell-/Dunkelmodus des Geräts */
:root { color-scheme: light dark;
  --bg: light-dark(#eef1eb, #0f1511); --raise: light-dark(#f8faf6, #172019); --field: light-dark(#fff, #172019);
  --ink: light-dark(#16201a, #e5eae3); --muted: light-dark(#5b675e, #93a096); --line: light-dark(#d6ddd3, #26302a); --line2: light-dark(#aab5ac, #46524a);
  --basil: light-dark(#2f6b48, #6fb18a); --kurkuma: light-dark(#d4961c, #e6ad3f); --sand: light-dark(#b9a27a, #a8946e); --red: light-dark(#c0412a, #e46b4d);
  --fd: "Bricolage Grotesque", system-ui, sans-serif; --fb: Geist, system-ui, -apple-system, sans-serif; --fm: "Geist Mono", ui-monospace, Menlo, monospace; --ease: cubic-bezier(.2, .7, .2, 1) }
:root[data-theme=light] { color-scheme: light } :root[data-theme=dark] { color-scheme: dark }
* { box-sizing: border-box } [hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--fb); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
h1, h2, h3, p, ul, ol { margin: 0 } ul, ol { padding: 0; list-style: none } button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--basil); outline-offset: 2px }
small { display: block; font-size: 13.5px; color: var(--muted) }
.app { max-width: 600px; margin: auto }
.g { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none }
.btn, .line { height: 46px; padding: 0 16px; border-radius: 13px; font-weight: 600; border: 1px solid var(--line2); background: none }
.btn { border: 0; background: var(--ink); color: var(--bg) } .btn:disabled { opacity: .3 }
.icon { display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 12px; background: none; color: var(--muted) }

/* Start */
.hero { position: relative; height: clamp(360px, 58svh, 480px); overflow: hidden; background: #1c2e22; color: #f4f1e8 }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #0c150ff0, #0c150f8c 30%, #0c150f00 56%) }
.hero > div { position: absolute; inset: auto 0 0; z-index: 1; padding-bottom: 56px }
.hero p:first-child { font: 500 12px var(--fm); letter-spacing: .16em; text-transform: uppercase; opacity: .8 }
.hero h1 { font: 800 clamp(50px, 16vw, 84px)/.88 var(--fd); letter-spacing: -.04em; margin: 12px 0 14px -2px } .hero h1 span { color: #f0b748 }
.hero p:last-child { font-size: 15px; opacity: .86 }
.up { position: absolute; z-index: 2; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 15px 0 11px; border-radius: 99px; border: 1px solid #fff4; background: #0c150f6b; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #f4f1e8; font-size: 14px; font-weight: 500 }
#tb { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-top: -38px; padding-block: 10px 12px } #tb.stuck { background: var(--bg); box-shadow: 0 1px 0 var(--line) }
form { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 6px 0 16px; background: var(--field); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 28px -16px #0a140e73; color: var(--muted) }
form:focus-within { border-color: var(--basil) }
#q { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font: 16px var(--fb) } #q::-webkit-search-cancel-button { display: none }
#chips { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none }
.chip { flex: none; height: 36px; padding: 0 11px; border: 1px solid var(--line2); border-radius: 99px; background: none; font-size: 13.5px; font-weight: 500 }
.chip span { margin-left: 6px; font: 12px var(--fm); opacity: .6 } .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.sec, .block { padding: 26px 0 10px; border-bottom: 1.5px solid var(--ink); font: 700 24px/1 var(--fd); letter-spacing: -.02em }
.row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none }
.row > div { flex: 1; min-width: 0 } .row h3 { font: 650 19px/1.2 var(--fd); letter-spacing: -.01em } .row:hover h3 { color: var(--basil) } .row > .i { color: var(--line2) }
.row p { margin: 6px 0 10px; font-size: 13.5px; color: var(--muted) }
.bar { display: flex; gap: 2px; height: 4px; max-width: 190px; border-radius: 3px; overflow: hidden }
.bar i:nth-child(1), .nutri div:nth-child(2) i { background: var(--basil) } .bar i:nth-child(2), .nutri div:nth-child(3) i { background: var(--kurkuma) } .bar i:nth-child(3), .nutri div:nth-child(4) i { background: var(--sand) }
.empty { padding-block: 48px; font: 650 22px/1.3 var(--fd) } .empty button { display: block; margin-top: 16px; font: 600 15px var(--fb) }

/* Rezept */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; height: 56px; background: var(--bg) } .top.scrolled { box-shadow: 0 1px 0 var(--line) }
.top a { display: flex; align-items: center; gap: 6px; height: 40px; margin-left: -6px; padding: 0 12px 0 6px; color: inherit; text-decoration: none; font-weight: 500 }
.top span { font: 650 15px var(--fd); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s } .top.scrolled span { opacity: 1 }
.in { animation: in .3s var(--ease) } @keyframes in { from { opacity: 0; transform: translateY(10px) } }
.title { margin-top: 4px; font: 750 clamp(32px, 9vw, 44px)/1.02 var(--fd); letter-spacing: -.03em; text-wrap: balance } .yield { margin-top: 10px; color: var(--muted) }
.nutri { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 22px; padding: 18px; background: var(--raise); border: 1px solid var(--line); border-radius: 20px }
.nutri b { display: block; font: 500 22px/1.1 var(--fm); letter-spacing: -.03em; white-space: nowrap } .nutri b small { display: inline; margin-left: 2px; font-size: 13px }
.nutri span { font-size: 12.5px; color: var(--muted) } .nutri div:nth-child(2) b { color: var(--basil) }
.nutri span i { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 2px }
.nutri .bar, .nutri p { grid-column: 1 / -1; max-width: none } .nutri .bar { height: 6px; margin-top: 8px } .nutri p { font: 12px var(--fm); color: var(--muted); text-align: right }
.grp { padding: 18px 0 6px; font: 600 12px var(--fm); letter-spacing: .12em; text-transform: uppercase } .grp small { display: inline; margin-left: 8px; font: 13px var(--fb); letter-spacing: 0; text-transform: none }
.ing { display: grid; grid-template-columns: 24px 4.9rem 1fr; gap: 12px; width: calc(100% + 14px); margin: 0 -8px 0 -6px; padding: 12px 8px 12px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left }
.box, .num { display: grid; place-items: center; border: 1.5px solid var(--line2); transition: .15s } .box .i, .num .i { width: 14px; height: 14px; stroke-width: 3 }
.box { width: 22px; height: 22px; border-radius: 7px; color: transparent } .amt { font: 500 14px/1.5 var(--fm); color: var(--muted) }
[aria-pressed=true] > .box, [aria-pressed=true] > .num { background: var(--basil); border-color: var(--basil); color: #fff } .ing[aria-pressed=true] > span:not(.box) { opacity: .42 }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 16.5px; line-height: 1.6 }
.num { width: 30px; height: 30px; border-radius: 50%; border-color: var(--ink); font: 500 13px var(--fm) } .num .i, [aria-pressed=true] .num span { display: none } [aria-pressed=true] .num .i { display: block }
.step[aria-pressed=true] > div { opacity: .45 } .step li { position: relative; padding-left: 16px } .step li::before { content: ""; position: absolute; left: 2px; top: .75em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted) }
.end { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 28px 140px } .end a { color: inherit; font-weight: 500 } .danger { color: var(--red) }
.cart { position: fixed; inset: auto 0 0; z-index: 25; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none }
.cart > div { display: flex; align-items: center; gap: 6px; max-width: 568px; margin: auto; padding: 8px 8px 8px 18px; border-radius: 18px; background: var(--ink); color: var(--bg); box-shadow: 0 14px 36px -14px #0008; pointer-events: auto }
.cart p { flex: 1; font-weight: 500 } .cart button { height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: none; font-size: 14px; font-weight: 600 } .cart button:last-child { background: var(--bg); color: var(--ink) }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; padding: 10px 16px; border-radius: 12px; background: var(--basil); color: #fff; font-size: 14px; font-weight: 500; opacity: 0; transform: translate(-50%, 8px); transition: .2s; pointer-events: none } #toast.show { opacity: 1; transform: translate(-50%, 0) }

/* Hochladen */
#sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center } .shade { position: absolute; inset: 0; background: #080e0a85 }
.panel { position: relative; width: 100%; max-width: 600px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 16px); overflow-y: auto; padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-radius: 24px 24px 0 0; animation: in .3s var(--ease) }
.panel h2 { flex: 1; font: 700 24px var(--fd) } .panel > div:first-child { display: flex; align-items: center; margin-bottom: 10px }
textarea { display: block; width: 100%; min-height: 36svh; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); color: var(--ink); font: 15px/1.5 var(--fb) } textarea:focus { outline: 0; border-color: var(--basil) }
.actions { display: flex; gap: 10px; margin-top: 12px } .actions .btn { flex: 1 } #msg { margin-top: 12px; color: var(--red) }
.pv { display: grid; gap: 10px; padding: 14px 0 16px; border-bottom: 1px solid var(--line) } .pv > div { display: flex; gap: 8px; flex-wrap: wrap }
.pv input { flex: 1; min-width: 0; padding: 4px 0; border: 0; border-bottom: 1px solid transparent; background: none; color: inherit; font: 650 19px var(--fd) } .pv input:focus { outline: 0; border-color: var(--basil) }
.seg { display: flex; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 7%, transparent) }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-size: 13.5px; font-weight: 500 } .seg [aria-pressed=true] { background: var(--field); color: var(--ink); box-shadow: 0 1px 2px #0002 }
.pv p { font-size: 13.5px; color: var(--muted) } .pv .danger { color: var(--red) }
@media (min-width: 700px) { .app { padding-top: 24px } .hero { border-radius: 28px } .hero > div { padding-inline: 32px } #sheet { align-items: center } .panel { border-radius: 24px } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>

</svg>

<div class="app">
  <main id="home">
    <header class="hero">
      <img src="start.jpg" alt="Gezeichnet von oben: Reis mit Butter Chicken, Tortillas, Joghurt, Gewürze und Zitrone" width="1200" height="1500">
      <button class="up" data-act="upload"><svg class="i"><use href="#plus"/></svg>Hochladen</button>

    </header>
    <div id="tb" class="g">
      <form id="sf" role="search"><svg class="i"><use href="#search"/></svg>
        <input id="q" type="search" placeholder="Rezept oder Zutat suchen" aria-label="Rezept oder Zutat suchen" autocomplete="off" enterkeyhint="search">
        <button type="button" class="icon" data-act="clear" aria-label="Suche leeren" hidden><svg class="i"><use href="#x"/></svg></button>

  <article id="detail" hidden></article>
</div>

<div id="sheet" hidden>
  <div class="shade" data-act="close"></div>
  <div class="panel g" role="dialog" aria-modal="true" aria-labelledby="sh">
    <div><h2 id="sh">Rezept hochladen</h2><button class="icon" data-act="close" aria-label="Schließen"><svg class="i"><use href="#x"/></svg></button></div>
    <div id="s-in">
      <textarea id="up" aria-label="Rezepttext" placeholder="Rezept hier einfügen, zum Beispiel:&#10;&#10;Butter Chicken Burritos&#10;Zutaten&#10;- 800 g Hähnchenbrust&#10;…&#10;Zubereitung&#10;1. …&#10;Nährwerte (pro Burrito): 375 kcal · 36 g Eiweiß"></textarea>
      <div class="actions"><button class="line" data-act="paste">Einfügen</button><button class="btn" data-act="convert">Umwandeln</button></div>
    </div>
    <div id="s-pv" hidden>
      <div id="pv"></div>
      <div class="actions"><button class="line" data-act="edit">Zurück</button><button class="btn" data-act="store">Speichern</button></div>
    </div>
    <p id="msg" role="status"></p>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s), ic = n => `<svg class="i"><use href="#${n}"/></svg>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const fmt = n => n == null ? "–" : n.toLocaleString("de-DE");
const norm = s => s.toLowerCase().replace(/ß/g, "ss").normalize("NFD").replace(/\p{M}/gu, "");
const slug = t => norm(t).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "rezept";
const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const toast = m => { const t = $("#toast"); t.textContent = m; t.className = "show"; clearTimeout(t.t); t.t = setTimeout(() => t.className = "", 1800); };

/* ---------- Rezept-Leser: Text → Rezepte (für rezepte.txt und Hochladen) ---------- */
const BUL = /^[-–—•◦*▪●·]\s*/, NUM = /^(\d+[.):]|schritt\s*\d+:?)\s*/i;
const HEAD = { ing: /^(zutaten|du brauchst|einkaufsliste)\b/i, steps: /^(zubereitung|anleitung|so geht|schritte)\b/i, nut: /^(nährwerte|makros)\b/i };
const NUT = "(kcal|kalorien|eiweiss|protein|kohlenhydrate|kh|fett)(?![a-z])", NK = { kcal: 0, kalorien: 0, eiweiss: 1, protein: 1, kohlenhydrate: 2, kh: 2, fett: 3 };
const AMT = /^((?:ca\.\s*)?(?:\d+(?:[.,]\d+)?\s*[½¼¾]?|[½¼¾])(?:\s*[–-]\s*\d+)?(?:\s*(?:kg|g|ml|l|EL|TL|Prisen?|Tassen?|Stück|Pck\.?|Dosen?|Bund|Zehen?|Scheiben?|Becher|Handvoll)(?![a-zäöüß]))?)\s+(.+)/i;
const MEAT = /hahnchen|chicken|huhn|rind|beef|schwein|schinken|speck|bacon|(^|[^e])hack|faschiert|pute|lamm|wurst|salami|chorizo|kebab|gyros|steak|sardell|thunfisch|lachs|fisch|garnele|shrimp|kalb/;
const SWEET = /kuchen|cake|brownie|cookie|keks|muffin|pancake|palatschinke|waffel|dessert|pudding|tiramisu|porridge|granola/;
const SWEETISH = /schoko|kakao|streusel|zucker|ahornsirup|chunky flavo|marmelade/, SAVORY = /zwiebel|knoblauch|bruhe|soja|senf|ketchup|tomate|chili|curry|parmesan|mozzarella|cheddar/;
const looksNut = l => { const t = norm(l); return /\d\s*(kcal|kalorien)(?![a-z])|(kcal|kalorien):?\s*\d/.test(t) || (t.match(/(eiweiss|protein|kohlenhydrate|fett)(?![a-z])/g) || []).length > 1; };

function item(s) { // "2 TL Ingwer (frisch)" → ["2 TL", "Ingwer", "frisch"]
  const hint = [];
  s = s.replace(/\s*\(([^)]*)\)$/, (_, h) => (hint.push(h), "")).replace(/[,\s]+(nach (?:Geschmack|Bedarf|Belieben)|optional)$/i, (_, h) => (hint.unshift(h), ""));
  const m = s.match(AMT);
  s = (m ? m[2] : s).replace(/,\s*([a-zäöüß½\d].*)$/, (_, h) => (hint.unshift(h), ""));
  return [m ? m[1].trim() : "", s.trim(), ...hint.length ? [hint.join(", ")] : []];
}
function nutr(l, r) { // "375 kcal · 36 g Eiweiß" oder "Protein: 36"
  const t = norm(l), set = (k, v) => r.n[NK[k]] ??= parseFloat(v.replace(",", "."));
  for (const m of t.matchAll(new RegExp(`(\\d+(?:[.,]\\d+)?)\\s*g?\\s*${NUT}`, "g"))) set(m[2], m[1]);
  for (const m of t.matchAll(new RegExp(`${NUT}\\s*:?\\s*(?:ca\\.?\\s*)?(\\d+(?:[.,]\\d+)?)`, "g"))) set(m[1], m[2]);
  if (/\bca\b|etwa|~/.test(t)) r.approx = true;
  r.per ||= (l.match(/\bpro\s+[^),:·|]+/i) || [""])[0].trim().replace(/^P/, "p");
}
function parse(text) {
  const L = text.split("\n").map(l => l.replace(/\s+/g, " ").trim());
  const meta = l => !l || BUL.test(l) || /^\d/.test(l) || Object.values(HEAD).some(h => h.test(l));
  let z = L.flatMap((l, i) => HEAD.ing.test(l) && l.length < 40 ? [i] : []);
  const head = z.length > 0;
  if (!head) z = [L.findIndex(Boolean)];
  if (z[0] < 0) return [];
  // Titel = erste Zeile des Absatzes über "Zutaten"
  const ts = z.map((i, k) => { if (!head) return i; const f = k ? z[k - 1] : -1; let s = i - 1; while (s > f && meta(L[s])) s--; while (s - 1 > f && !meta(L[s - 1])) s--; return s > f ? s : -1; });
  return z.map((i, k) => {
    const s = ts[k], end = k + 1 < z.length ? (ts[k + 1] < 0 ? z[k + 1] : ts[k + 1]) : L.length;
    const r = { title: s < 0 ? "Neues Rezept" : L[s].replace(/^(high[\s-]?protein|rezept:?)\s+/i, "").replace(/\s*\(\d+ \w+\)$|[:!]+$/g, ""), kind: "herzhaft", meat: false, yield: "", per: "", approx: false, n: [null, null, null, null], groups: [], steps: [] };
    const sec = { ing: [], steps: [], nut: [] };
    for (const l of head && s >= 0 ? L.slice(s + 1, i) : []) { const y = l.match(/^ergibt:?\s+(.+)/i); if (y) r.yield = y[1]; else if (looksNut(l)) sec.nut.push(l); }
    let mode = "ing", g, cur;
    for (const l of L.slice(i + 1, end)) {
      if (!l) continue;
      const h = l.length < 40 && Object.keys(HEAD).find(k => HEAD[k].test(l));
      if (h) { mode = h; if (h == "nut") sec.nut.push(l); }
      else sec[!NUM.test(l) && looksNut(l) ? "nut" : mode].push(l);
    }
    const bul = sec.ing.some(l => BUL.test(l));
    for (const raw of sec.ing) { // Zeilen ohne Aufzählungszeichen sind Zwischenüberschriften ("Teig", "Für die Füllung:")
      const l = raw.replace(BUL, "");
      if (l.length < 60 && (bul ? !BUL.test(raw) && !/^\d/.test(l) : /:$|^für (die|den|das) /i.test(l))) {
        const [, name, note = ""] = l.replace(/^für (die|den|das) /i, "").match(/^(.*?)\s*(?:\((.*)\))?:?$/);
        r.groups.push(g = [name.replace(/^./, c => c.toUpperCase()), note, []]);
      } else { if (!g) r.groups.push(g = ["", "", []]); g[2].push(item(l)); }
    }
    r.groups = r.groups.filter(g => g[2].length);
    const numbered = sec.steps.some(l => NUM.test(l));
    for (const raw of sec.steps) { // nummerierte Schritte; Aufzählungen darunter werden Unterpunkte
      const l = raw.replace(BUL, ""), b = BUL.test(raw);
      if (!numbered || !b && NUM.test(l)) r.steps.push(cur = [l.replace(NUM, ""), []]);
      else if (cur) b ? cur[1].push(l) : cur[0] += " " + l;
      else r.steps.push(cur = [l, []]);
    }
    r.steps = r.steps.map(([t, sub]) => sub.length ? [t, sub] : t);
    sec.nut.forEach(l => nutr(l, r));
    const y = ((L[s] || "") + " " + sec.steps.join(" ")).match(/(?:für|auf|\()\s*(\d+)\s+(?:Portionen|Personen|Meal-Prep-Boxen)/i);
    if (!r.yield && y) r.yield = y[1] + " Portionen";
    const words = norm(r.title + " " + r.groups.flatMap(g => g[2].map(x => x[1])).join(" "));
    r.meat = MEAT.test(words);
    r.kind = !r.meat && (SWEET.test(norm(r.title)) || SWEETISH.test(words) && !SAVORY.test(words)) ? "suess" : "herzhaft";
    return r;
  });
}

/* ---------- Daten (alles im Browser gespeichert) ---------- */
const KEY = "naehrwerk:v2", MINE = "naehrwerk:recipes:v1"; // Namen bleiben, damit nichts verloren geht
const st = Object.assign({ have: {}, done: {} }, get(KEY, {}));
const FILTERS = { alle: ["Alle", () => 1], fleisch: ["Fleisch", r => r.meat], vegetarisch: ["Vegetarisch", r => !r.meat], suess: ["Süß", r => r.kind == "suess"] };
let base = [], mine = get(MINE, []), all = [], filter = "alle", cur = null, pending = [], homeY = 0;
const q = $("#q"), up = $("#up");

function build() {
  all = [...base, ...mine.map(r => ({ ...r, mine: true }))];
  for (const r of all) r.idx = norm([r.title, r.meat ? "fleisch" : "vegetarisch", r.kind == "suess" ? "süß" : "herzhaft", ...r.groups.flat(2)].join(" "));
}
function bar(r) { // Anteil von Eiweiß, Kohlenhydraten und Fett an den Kalorien
  const [, p, c, f] = r.n;
  return p == null || c == null || f == null ? "" : `<span class="bar">${[p * 4, c * 4, f * 9].map(v => `<i style="flex:${v}"></i>`).join("")}</span>`;
}

/* ---------- Startseite ---------- */
function renderHome() {
  const words = norm(q.value).split(/\s+/).filter(Boolean), hit = r => words.every(w => r.idx.includes(w));
  const ps = all.map(r => r.n[1]).filter(v => v != null);
  $("#count").textContent = `${all.length} Rezepte · Ø ${Math.round(ps.reduce((a, b) => a + b, 0) / ps.length || 0)} g Eiweiß`;
  $("[data-act=clear]").hidden = !q.value;
  $("#chips").innerHTML = Object.entries(FILTERS).map(([k, [label, f]]) => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${k == filter}">${label}<span>${all.filter(r => f(r) && hit(r)).length}</span></button>`).join("");
  const list = all.filter(r => FILTERS[filter][1](r) && hit(r)).sort((a, b) => a.title.localeCompare(b.title, "de"));
  const row = r => `<a class="row" href="#${r.id}"><div><h3>${esc(r.title)}</h3><p>${[r.n[0] != null && (r.approx ? "ca. " : "") + fmt(r.n[0]) + " kcal", r.yield].filter(Boolean).map(esc).join(" · ")}</p>${bar(r)}</div>${ic("next")}</a>`;
  $("#list").innerHTML = list.length ? [["herzhaft", "Herzhaft"], ["suess", "Süß"]].map(([k, label]) => {
    const rs = list.filter(r => r.kind == k);
    return rs.length ? `<h2 class="sec">${label}</h2>${rs.map(row).join("")}` : "";
  }).join("") : `<div class="empty">Nichts gefunden${q.value ? ` für „${esc(q.value.trim())}“` : ""}.<button class="line" data-act="reset">Suche zurücksetzen</button></div>`;
}

/* ---------- Rezept ---------- */
function renderDetail(r) {
  const have = new Set(st.have[r.id]), done = new Set(st.done[r.id]), g = v => v == null ? "–" : `${fmt(v)}<small>g</small>`;
  $("#detail").innerHTML = `
    <header class="top g"><a href="#">${ic("back")}Rezepte</a><span>${esc(r.title)}</span></header>
    <div class="g in">
      <h1 class="title">${esc(r.title)}</h1>${r.yield ? `<p class="yield">Ergibt ${esc(r.yield)}</p>` : ""}
      ${r.n.some(v => v != null) ? `<section class="nutri"><div><b>${fmt(r.n[0])}</b><span>kcal</span></div><div><b>${g(r.n[1])}</b><span><i></i>Eiweiß</span></div><div><b>${g(r.n[2])}</b><span><i></i>Kohlenh.</span></div><div><b>${g(r.n[3])}</b><span><i></i>Fett</span></div>${bar(r)}<p>${esc((r.per || "Portionsgröße nicht angegeben") + (r.approx ? " · ca." : ""))}</p></section>` : ""}
      <h2 class="block">Zutaten</h2>
      ${r.groups.map(([name, note, items], gi) => (name || note ? `<h3 class="grp">${esc(name)}<small>${esc(note)}</small></h3>` : "") + items.map(([a, n, h], ii) =>
        `<button class="ing" data-act="have" data-k="${gi}-${ii}" aria-pressed="${have.has(`${gi}-${ii}`)}"><span class="box">${ic("check")}</span><span class="amt">${esc(a || "–")}</span><span>${esc(n)}${h ? `<small>${esc(h)}</small>` : ""}</span></button>`).join("")).join("")}
      <h2 class="block">Zubereitung</h2>
      <ol>${r.steps.map((s, i) => { const [t, sub] = [].concat(s); return `<li class="step" role="button" tabindex="0" data-act="done" data-k="${i}" aria-pressed="${done.has(i)}"><span class="num"><span>${i + 1}</span>${ic("check")}</span><div>${esc(t)}${sub ? `<ul>${sub.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div></li>`; }).join("")}</ol>
      <div class="end"><a href="#">Zurück zu allen Rezepten</a><button class="line" data-act="undone">Schritte zurücksetzen</button>${r.mine ? `<button class="line danger" data-act="del">Rezept löschen</button>` : ""}</div>
    </div>
    <div class="cart g"><div><p></p><button data-act="unhave">Zurücksetzen</button><button data-act="copy">Liste kopieren</button></div></div>`;
  update();
}
function update() { // Leiste unten: was noch fehlt
  const have = (st.have[cur.id] || []).length, miss = cur.groups.reduce((a, g) => a + g[2].length, 0) - have;
  $(".cart").hidden = !have;
  $(".cart p").innerHTML = miss ? `<b>${miss}</b> fehl${miss == 1 ? "t" : "en"}` : "Alles da";
  $("[data-act=copy]").hidden = !miss;
  $("[data-act=undone]").hidden = !(st.done[cur.id] || []).length;
}
function toggle(kind, k, b) {
  const s = new Set(st[kind][cur.id]);
  s.has(k) ? s.delete(k) : s.add(k);
  st[kind][cur.id] = [...s]; put(KEY, st);
  b.setAttribute("aria-pressed", s.has(k)); update();
}

/* ---------- Hochladen ---------- */
const msg = m => $("#msg").textContent = m || "";
const canConvert = () => $("[data-act=convert]").disabled = !up.value.trim();
function step(s) { $("#s-in").hidden = s != "in"; $("#s-pv").hidden = s == "in"; msg(); if (s == "in") $("#sh").textContent = "Rezept hochladen"; }
function sheet(on) { $("#sheet").hidden = !on; document.documentElement.style.overflow = on ? "hidden" : ""; if (on) { step("in"); canConvert(); up.focus(); } }
function preview() {
  step("pv");
  $("#sh").textContent = pending.length > 1 ? `${pending.length} Rezepte erkannt` : "Passt das so?";
  $("[data-act=store]").textContent = pending.length > 1 ? `${pending.length} Rezepte speichern` : "Speichern";
  $("#pv").innerHTML = pending.map((r, i) => {
    const seg = (k, v, label) => `<button data-act="set" data-i="${i}" data-k="${k}" data-v="${v}" aria-pressed="${String(r[k]) == v}">${label}</button>`;
    return `<div class="pv"><div><input data-i="${i}" value="${esc(r.title)}" aria-label="Name des Rezepts">${pending.length > 1 ? `<button class="icon" data-act="rm" data-i="${i}" aria-label="Nicht speichern">${ic("x")}</button>` : ""}</div>
      <div><span class="seg">${seg("kind", "herzhaft", "Herzhaft")}${seg("kind", "suess", "Süß")}</span><span class="seg">${seg("meat", "true", "Fleisch")}${seg("meat", "false", "Vegetarisch")}</span></div>
      <p>${r.groups.reduce((a, g) => a + g[2].length, 0)} Zutaten · ${r.steps.length} Schritte${r.n[0] != null ? ` · ${fmt(r.n[0])} kcal` : ""}</p>
      ${all.some(x => norm(x.title) == norm(r.title)) ? `<p class="danger">Ein Rezept mit diesem Namen gibt es schon.</p>` : ""}</div>`;
  }).join("");
}

/* ---------- Klicks: data-act="…" auf einem Element ruft act[…] auf ---------- */
const act = {
  filter: b => { filter = b.dataset.v; renderHome(); },
  clear: () => { q.value = ""; renderHome(); q.focus(); },
  reset: () => { q.value = ""; filter = "alle"; renderHome(); },
  have: b => toggle("have", b.dataset.k, b),
  done: b => toggle("done", +b.dataset.k, b),
  unhave: () => { delete st.have[cur.id]; put(KEY, st); $$(".ing").forEach(b => b.setAttribute("aria-pressed", false)); update(); },
  undone: () => { delete st.done[cur.id]; put(KEY, st); $$(".step").forEach(b => b.setAttribute("aria-pressed", false)); update(); },
  copy: () => {
    const have = new Set(st.have[cur.id]);
    const list = cur.groups.flatMap((g, gi) => g[2].filter((_, ii) => !have.has(`${gi}-${ii}`)).map(([a, n]) => `– ${a ? a + " " : ""}${n}`));
    Promise.resolve().then(() => navigator.clipboard.writeText(`Einkaufsliste · ${cur.title}\n${list.join("\n")}`)).then(() => toast("Einkaufsliste kopiert"), () => toast("Kopieren ging nicht"));
  },
  del: b => {
    if (!b.dataset.sure) return b.dataset.sure = b.textContent = "Wirklich löschen?";
    mine = mine.filter(r => r.id != cur.id); put(MINE, mine); build(); toast("Rezept gelöscht"); location.hash = "";
  },
  upload: () => sheet(true),
  close: () => sheet(false),
  paste: () => Promise.resolve().then(() => navigator.clipboard.readText()).then(t => { up.value = t; canConvert(); }, () => msg("Einfügen ging nicht. Halte im Feld gedrückt und wähle „Einsetzen“.")),
  convert: () => { pending = parse(up.value); pending.length ? preview() : msg("Kein Rezept erkannt. Am besten klappt es mit Name, „Zutaten“ und „Zubereitung“."); },
  edit: () => step("in"),
  rm: b => { pending.splice(b.dataset.i, 1); preview(); },
  set: b => { const v = b.dataset.v; pending[b.dataset.i][b.dataset.k] = v == "true" ? true : v == "false" ? false : v; preview(); },
  store: () => {
    const ids = new Set(all.map(r => r.id));
    const add = pending.map(r => { let id = slug(r.title), n = 1; while (ids.has(id)) id = `${slug(r.title)}-${++n}`; ids.add(id); return { ...r, title: r.title.trim() || "Neues Rezept", id }; });
    if (!put(MINE, [...mine, ...add])) return msg("Speichern ging nicht. Der Speicher ist voll.");
    mine.push(...add); build(); sheet(false); up.value = "";
    toast(add.length > 1 ? `${add.length} Rezepte gespeichert` : "Rezept gespeichert");
    add.length == 1 ? location.hash = add[0].id : renderHome();
  }
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) act[b.dataset.act](b); });
document.addEventListener("input", e => { const t = e.target; if (t == q) renderHome(); else if (t == up) canConvert(); else if (t.dataset.i) pending[t.dataset.i].title = t.value; });
document.addEventListener("keydown", e => {
  if (e.key == "Escape") sheet(false);
  if ((e.key == "Enter" || e.key == " ") && e.target.dataset?.act == "done") { e.preventDefault(); e.target.click(); }
});
$("#sf").onsubmit = e => { e.preventDefault(); q.blur(); };

/* ---------- Navigation (#rezept-name), Bildschirm an beim Kochen ---------- */
let lock;
const wake = on => on ? navigator.wakeLock?.request("screen").then(l => lock = l, () => {}) : lock?.release();
function route() {
  const r = all.find(x => x.id == decodeURIComponent(location.hash.slice(1)));
  if (r && !cur) homeY = scrollY;
  $("#home").hidden = !!r; $("#detail").hidden = !r;
  if (r) { cur = r; renderDetail(r); scrollTo(0, 0); } else { cur = null; renderHome(); scrollTo(0, homeY); }
  document.title = r ? `${r.title} · Meal Prep` : "Meal Prep";
  wake(r); onScroll();
}
function onScroll() {
  const tb = $("#tb"), h = $(".title");
  tb.classList.toggle("stuck", tb.getBoundingClientRect().top < parseFloat(getComputedStyle(tb).top) + 1);
  if (cur && h) $(".top").classList.toggle("scrolled", h.getBoundingClientRect().bottom < 56);
}
addEventListener("scroll", onScroll, { passive: true });
addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => cur && !document.hidden && wake(true));
fetch("rezepte.txt").then(r => r.text()).catch(() => "").then(t => { base = parse(t).map(r => ({ ...r, id: slug(r.title) })); build(); route(); });
</script>
